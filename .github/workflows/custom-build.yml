name: custom-build

on:
  push:
    # 数字标签用于 fork 的 Windows Release，官方工作流使用 v 前缀。
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 Windows 安装包
    if: github.event_name == 'workflow_dispatch' || github.event.created == true
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 核对版本标签
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne $version) {
            throw "版本标签 $env:GITHUB_REF_NAME 必须与 package.json 的 $version 一致"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 安装依赖
        run: npm ci

      - name: 构建应用
        run: npm run build

      - name: 打包 Windows x64
        shell: pwsh
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          $builderArgs = @(
            '--win', '--x64',
            '--publish', 'never',
            '-c.publish.provider=github',
            "-c.publish.owner=$env:REPO_OWNER",
            "-c.publish.repo=$env:REPO_NAME",
            '-c.publish.vPrefixedTagName=false'
          )
          npx electron-builder @builderArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          foreach ($pattern in @('*.exe', '*.exe.blockmap', '*.zip', 'latest.yml')) {
            if (-not (Get-ChildItem -LiteralPath release -Filter $pattern -File)) {
              throw "缺少 Windows 产物 $pattern"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ColaMD-win64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.zip
            release/latest.yml
          retention-days: 30
          if-no-files-found: error

  release:
    name: 发布 Windows Release
    if: github.event_name == 'push' && github.event.created == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ColaMD-win64
          path: artifacts

      - name: 发布已构建的安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
